name: Build & Deploy Hugo site to GitHub Pages

# 触发条件：当 push 到 main 分支，或手动触发
on:
  push:
    branches:
      - mster          # 如你的主分支不是 main，请改为实际分支名
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.151.0'        # 可根据你自己的 Hugo 版本调整
      NODE_VERSION: '22.x'           # 若主题／构建用到 Node，可保留；否则可删
      TZ: 'Asia/Taipei'              # 时区设为台湾时区
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js (optional)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p ~/.local/hugo
          tar -C ~/.local/hugo -xf hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Verify Hugo version
        run: hugo version

      - name: Install Node dependencies (if needed)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            echo "No Node dependencies to install"
          fi

      - name: Build the site
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public   # 默认 Hugo 输出目录；如你改过 publishDir，请改这一行

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4