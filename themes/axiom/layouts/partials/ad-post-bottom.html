{{- if .Site.Params.services.adsenseAdSlotId }}
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client={{ .Site.Params.services.adsenseId }}"
     crossorigin="anonymous"></script>
<!-- bull -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="{{ .Site.Params.services.adsenseId }}"
     data-ad-slot="{{ .Site.Params.services.adsenseAdSlotId }}"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
{{- end }}
